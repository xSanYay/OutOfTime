<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>OutOfTime</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000;
            --fg: #fff;
            --fg-dim: rgba(255, 255, 255, 0.35);
            --fg-faint: rgba(255, 255, 255, 0.08);
            --fg-subtle: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(255, 255, 255, 0.25);
            --card-glow: rgba(255, 255, 255, 0.06);
            --icon-border: rgba(255, 255, 255, 0.15);
        }

        [data-theme="warm"] {
            --bg: #1a1410;
            --fg: #f5e6d3;
            --fg-dim: rgba(245, 230, 211, 0.4);
            --fg-faint: rgba(245, 230, 211, 0.06);
            --fg-subtle: rgba(245, 230, 211, 0.15);
            --card-border: rgba(245, 230, 211, 0.08);
            --card-hover-border: rgba(232, 201, 160, 0.35);
            --card-glow: rgba(232, 201, 160, 0.06);
            --icon-border: rgba(232, 201, 160, 0.2);
        }

        [data-theme="cool"] {
            --bg: #0a0f1a;
            --fg: #c8d8f0;
            --fg-dim: rgba(200, 216, 240, 0.4);
            --fg-faint: rgba(200, 216, 240, 0.06);
            --fg-subtle: rgba(200, 216, 240, 0.15);
            --card-border: rgba(200, 216, 240, 0.08);
            --card-hover-border: rgba(108, 155, 219, 0.4);
            --card-glow: rgba(108, 155, 219, 0.06);
            --icon-border: rgba(108, 155, 219, 0.2);
        }

        [data-theme="green"] {
            --bg: #0a1410;
            --fg: #c8e8d3;
            --fg-dim: rgba(200, 232, 211, 0.4);
            --fg-faint: rgba(200, 232, 211, 0.06);
            --fg-subtle: rgba(200, 232, 211, 0.15);
            --card-border: rgba(200, 232, 211, 0.08);
            --card-hover-border: rgba(92, 184, 122, 0.4);
            --card-glow: rgba(92, 184, 122, 0.06);
            --icon-border: rgba(92, 184, 122, 0.2);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Grid lines background */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--fg-faint) 1px, transparent 1px),
                linear-gradient(90deg, var(--fg-faint) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }

        /* Theme switcher */
        .theme-bar {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 6px;
            z-index: 5;
        }

        .theme-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1.5px solid var(--fg-subtle);
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-dot:hover {
            transform: scale(1.2);
        }

        .theme-dot.active {
            border-color: var(--fg);
            box-shadow: 0 0 8px var(--fg-faint);
        }

        .theme-dot[data-t="dark"] {
            background: #000;
        }

        .theme-dot[data-t="warm"] {
            background: #3a2a18;
        }

        .theme-dot[data-t="cool"] {
            background: #1a2a40;
        }

        .theme-dot[data-t="green"] {
            background: #1a3020;
        }

        /* Header */
        .brand {
            text-align: center;
        }

        .brand h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--fg);
            margin-bottom: 12px;
        }

        .brand h1 span {
            font-weight: 700;
        }

        .brand p {
            font-size: 0.85rem;
            color: var(--fg-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            width: 100%;
        }

        .card {
            position: relative;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 48px 36px;
            text-decoration: none;
            color: var(--fg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--fg-faint);
            overflow: hidden;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(circle at 50% 120%, var(--card-glow) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover {
            border-color: var(--card-hover-border);
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            width: 64px;
            height: 64px;
            border: 1px solid var(--icon-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .card:hover .card-icon {
            border-color: var(--card-hover-border);
            box-shadow: 0 0 30px var(--fg-faint);
        }

        .card-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--fg-dim);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card:hover .card-icon svg {
            stroke: var(--fg);
        }

        .card h2 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .card p {
            font-size: 0.8rem;
            color: var(--fg-dim);
            text-align: center;
            line-height: 1.6;
        }

        /* Footer */
        .footer {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .footer a {
            font-size: 0.75rem;
            color: var(--fg-dim);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--fg);
        }

        .footer .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--fg-subtle);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .brand h1 {
                font-size: 2.2rem;
                letter-spacing: 4px;
            }

            .card {
                padding: 36px 28px;
            }

            .content {
                gap: 40px;
                padding: 24px;
            }
        }

        /* Entry animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            animation: fadeUp 0.6s ease both;
        }

        .grid {
            animation: fadeUp 0.6s 0.15s ease both;
        }

        .footer {
            animation: fadeUp 0.6s 0.3s ease both;
        }
    </style>
</head>

<body data-theme="dark">
    <!-- Theme switcher -->
    <div class="theme-bar">
        <div class="theme-dot active" data-t="dark" onclick="setTheme('dark')" title="Dark"></div>
        <div class="theme-dot" data-t="warm" onclick="setTheme('warm')" title="Warm"></div>
        <div class="theme-dot" data-t="cool" onclick="setTheme('cool')" title="Cool"></div>
        <div class="theme-dot" data-t="green" onclick="setTheme('green')" title="Green"></div>
    </div>

    <div class="content">
        <div class="brand">
            <h1>Out<span>Of</span>Time</h1>
            <p>Manage your time, your way</p>
        </div>

        <div class="grid">
            <a href="/tasks" class="card" id="tasks-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 11l3 3L22 4" />
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
                    </svg>
                </div>
                <h2>Tasks</h2>
                <p>Organize, sequence, and track your todos with subtasks</p>
            </a>

            <a href="/timer" class="card" id="timer-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </div>
                <h2>Timer</h2>
                <p>Track your time with a dynamic, auto-scaling stopwatch</p>
            </a>
        </div>

        <div class="footer">
            <a href="/integrations">Integrations</a>
            <div class="dot"></div>
            <a href="/tasks">All Tasks</a>
        </div>
    </div>

    <script>
        function setTheme(t) {
            document.body.setAttribute('data-theme', t === 'dark' ? 'dark' : t);
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.t === t));
            localStorage.setItem('landingTheme', t);
        }
        (function () {
            const saved = localStorage.getItem('landingTheme');
            if (saved) setTheme(saved);
        })();
    </script>
</body>

</html>
