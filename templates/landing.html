<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>OutOfTime</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle animated grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* Grid lines background */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }

        /* Header */
        .brand {
            text-align: center;
        }

        .brand h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 12px;
            position: relative;
        }

        .brand h1 span {
            font-weight: 700;
        }

        .brand p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            width: 100%;
        }

        .card {
            position: relative;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 48px 36px;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255,255,255,0.02);
            overflow: hidden;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(circle at 50% 120%, rgba(255,255,255,0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover {
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            width: 64px;
            height: 64px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .card:hover .card-icon {
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 0 30px rgba(255,255,255,0.05);
        }

        .card-icon svg {
            width: 28px;
            height: 28px;
            stroke: rgba(255,255,255,0.7);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card h2 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .card p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.35);
            text-align: center;
            line-height: 1.6;
        }

        /* Footer */
        .footer {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .footer a {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: rgba(255,255,255,0.6);
        }

        .footer .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .brand h1 {
                font-size: 2.2rem;
                letter-spacing: 4px;
            }

            .card {
                padding: 36px 28px;
            }

            .content {
                gap: 40px;
                padding: 24px;
            }
        }

        /* Entry animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand { animation: fadeUp 0.6s ease both; }
        .grid { animation: fadeUp 0.6s 0.15s ease both; }
        .footer { animation: fadeUp 0.6s 0.3s ease both; }
    </style>
</head>
<body>
    <div class="content">
        <div class="brand">
            <h1>Out<span>Of</span>Time</h1>
            <p>Manage your time, your way</p>
        </div>

        <div class="grid">
            <a href="/tasks" class="card" id="tasks-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                    </svg>
                </div>
                <h2>Tasks</h2>
                <p>Organize, sequence, and track your todos with subtasks</p>
            </a>

            <a href="/timer" class="card" id="timer-card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <h2>Timer</h2>
                <p>Track your time with a dynamic, auto-scaling stopwatch</p>
            </a>
        </div>

        <div class="footer">
            <a href="/integrations">Integrations</a>
            <div class="dot"></div>
            <a href="/tasks">All Tasks</a>
        </div>
    </div>
</body>
</html>
