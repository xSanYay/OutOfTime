<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>Timer — OutOfTime</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000;
            --fg: #fff;
            --fg-dim: rgba(255, 255, 255, 0.35);
            --fg-faint: rgba(255, 255, 255, 0.08);
            --fg-subtle: rgba(255, 255, 255, 0.15);
            --ring-stroke: #fff;
            --ring-bg: rgba(255, 255, 255, 0.06);
            --tick-color: rgba(255, 255, 255, 0.1);
            --tick-major: rgba(255, 255, 255, 0.3);
        }

        [data-theme="warm"] {
            --bg: #1a1410;
            --fg: #f5e6d3;
            --fg-dim: rgba(245, 230, 211, 0.4);
            --fg-faint: rgba(245, 230, 211, 0.06);
            --fg-subtle: rgba(245, 230, 211, 0.15);
            --ring-stroke: #e8c9a0;
            --ring-bg: rgba(232, 201, 160, 0.08);
            --tick-color: rgba(232, 201, 160, 0.12);
            --tick-major: rgba(232, 201, 160, 0.35);
        }

        [data-theme="cool"] {
            --bg: #0a0f1a;
            --fg: #c8d8f0;
            --fg-dim: rgba(200, 216, 240, 0.4);
            --fg-faint: rgba(200, 216, 240, 0.06);
            --fg-subtle: rgba(200, 216, 240, 0.15);
            --ring-stroke: #6c9bdb;
            --ring-bg: rgba(108, 155, 219, 0.08);
            --tick-color: rgba(108, 155, 219, 0.12);
            --tick-major: rgba(108, 155, 219, 0.35);
        }

        [data-theme="green"] {
            --bg: #0a1410;
            --fg: #c8e8d3;
            --fg-dim: rgba(200, 232, 211, 0.4);
            --fg-faint: rgba(200, 232, 211, 0.06);
            --fg-subtle: rgba(200, 232, 211, 0.15);
            --ring-stroke: #5cb87a;
            --ring-bg: rgba(92, 184, 122, 0.08);
            --tick-color: rgba(92, 184, 122, 0.12);
            --tick-major: rgba(92, 184, 122, 0.35);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* grid bg */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--fg-faint) 1px, transparent 1px),
                linear-gradient(90deg, var(--fg-faint) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            padding: 24px 24px 80px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back {
            font-size: 0.8rem;
            color: var(--fg-dim);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color .3s;
        }

        .back:hover {
            color: var(--fg);
        }

        .top-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .theme-switcher {
            display: flex;
            gap: 6px;
        }

        .theme-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1.5px solid var(--fg-subtle);
            cursor: pointer;
            transition: all .3s;
        }

        .theme-dot:hover {
            transform: scale(1.2);
        }

        .theme-dot.active {
            border-color: var(--fg);
            box-shadow: 0 0 8px var(--fg-faint);
        }

        .theme-dot[data-t="dark"] {
            background: #000;
        }

        .theme-dot[data-t="warm"] {
            background: #3a2a18;
        }

        .theme-dot[data-t="cool"] {
            background: #1a2a40;
        }

        .theme-dot[data-t="green"] {
            background: #1a3020;
        }

        /* Timers grid */
        .timers-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            justify-items: center;
        }

        /* Single timer card */
        .timer-card {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px 16px;
            border: 1px solid var(--fg-faint);
            border-radius: 16px;
            background: var(--fg-faint);
            position: relative;
            transition: border-color 0.3s;
        }

        .timer-card.running {
            border-color: var(--ring-stroke);
        }

        .timer-card .remove-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--fg-dim);
            font-size: 1.1rem;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all .2s;
        }

        .timer-card .remove-btn:hover {
            color: rgba(220, 80, 80, 0.8);
            background: rgba(220, 80, 80, 0.1);
        }

        /* Title input */
        .title-input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--fg-subtle);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
            transition: border-color .3s;
        }

        .title-input::placeholder {
            color: var(--fg-dim);
        }

        .title-input:focus {
            border-color: var(--ring-stroke);
        }

        /* Tier label */
        .tier-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--fg-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Timer circle */
        .timer-container {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .timer-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: var(--ring-bg);
            stroke-width: 3;
        }

        .ring-progress {
            fill: none;
            stroke: var(--ring-stroke);
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset .3s linear;
        }

        .tick {
            stroke: var(--tick-color);
            stroke-width: 0.8;
        }

        .tick-major {
            stroke: var(--tick-major);
            stroke-width: 1.2;
        }

        .center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .elapsed {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--fg);
        }

        /* Controls below circle */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 44px;
        }

        .btn-ctrl {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--fg-subtle);
            background: transparent;
            color: var(--fg-dim);
            cursor: pointer;
            transition: all .3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn-ctrl:hover {
            border-color: var(--fg);
            color: var(--fg);
        }

        .btn-ctrl svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-start-wide {
            width: auto;
            padding: 0 22px;
            border-radius: 22px;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        .btn-stop {
            border-color: rgba(220, 80, 80, 0.3);
            color: rgba(220, 80, 80, 0.6);
        }

        .btn-stop:hover {
            border-color: rgba(220, 80, 80, 0.7);
            color: rgba(220, 80, 80, 1);
        }

        /* Add timer button */
        .add-timer-btn {
            width: 100%;
            max-width: 360px;
            padding: 16px;
            border: 1px dashed var(--fg-subtle);
            border-radius: 16px;
            background: transparent;
            color: var(--fg-dim);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-timer-btn:hover {
            border-color: var(--fg-subtle);
            color: var(--fg);
            background: var(--fg-faint);
        }

        /* Bottom bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 5;
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 16px 24px;
            background: linear-gradient(transparent, var(--bg) 40%);
        }

        .bar-btn {
            font-size: 0.7rem;
            color: var(--fg-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--fg-faint);
            border: 1px solid var(--fg-subtle);
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all .3s;
            font-family: 'Space Grotesk', sans-serif;
        }

        .bar-btn:hover {
            border-color: var(--fg-subtle);
            color: var(--fg);
        }

        .bar-btn .badge {
            display: inline-block;
            background: var(--ring-stroke);
            color: var(--bg);
            font-size: 0.6rem;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 6px;
            font-weight: 600;
        }

        /* Calendar badge */
        .cal-badge {
            position: fixed;
            bottom: 60px;
            right: 24px;
            font-size: 0.65rem;
            color: var(--fg-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 6;
        }

        .cal-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--fg-faint);
            border: 1px solid var(--fg-subtle);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--fg-dim);
            letter-spacing: 1px;
            opacity: 0;
            transition: all .4s;
            pointer-events: none;
            z-index: 10;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Entry */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .page>* {
            animation: fadeUp .5s ease both;
        }

        .page>*:nth-child(1) {
            animation-delay: 0s;
        }

        .page>*:nth-child(2) {
            animation-delay: .08s;
        }

        @media (max-width:480px) {
            .timer-container {
                width: 180px;
                height: 180px;
            }

            .elapsed {
                font-size: 1.4rem;
            }

            .timers-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body data-theme="dark">
    <div class="page">
        <div class="top-bar">
            <a href="/" class="back">← Back</a>
            <div class="top-actions">
                <div class="theme-switcher">
                    <div class="theme-dot active" data-t="dark" onclick="setTheme('dark')" title="Dark"></div>
                    <div class="theme-dot" data-t="warm" onclick="setTheme('warm')" title="Warm"></div>
                    <div class="theme-dot" data-t="cool" onclick="setTheme('cool')" title="Cool"></div>
                    <div class="theme-dot" data-t="green" onclick="setTheme('green')" title="Green"></div>
                </div>
            </div>
        </div>

        <div class="timers-grid" id="timersGrid"></div>
    </div>

    {% if calendar_enabled and calendar_connected %}
    <div class="cal-badge">
        <div class="cal-dot"></div>Calendar sync on
    </div>
    {% endif %}

    <!-- Bottom bar -->
    <div class="bottom-bar">
        <button class="bar-btn" onclick="addTimer()">+ Add Timer</button>
        <button class="bar-btn" id="btnDownload" onclick="downloadAllICS()">
            ↓ Download .ics <span class="badge" id="sessionCount">0</span>
        </button>
        <button class="bar-btn" onclick="clearSessions()">Clear Sessions</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ─── Theme ─────────────────────────────────
        function setTheme(t) {
            document.body.setAttribute('data-theme', t);
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.t === t));
            localStorage.setItem('timerTheme', t);
        }
        (function () { const s = localStorage.getItem('timerTheme'); if (s) setTheme(s); })();

        // ─── Tier Config ───────────────────────────
        const TIERS = [
            { label: '0 — 60 sec', maxSeconds: 60 },
            { label: '0 — 60 min', maxSeconds: 3600 },
            { label: '0 — 4 hours', maxSeconds: 14400 },
            { label: '0 — 8 hours', maxSeconds: 28800 },
            { label: '0 — 12 hours', maxSeconds: 43200 },
        ];

        const calendarEnabled = {{ 'true' if (calendar_enabled and calendar_connected) else 'false' }};

        // ─── Sessions store ────────────────────────
        let sessions = JSON.parse(localStorage.getItem('timerSessions') || '[]');
        updateSessionBadge();

        // ─── Timer instances ───────────────────────
        let nextId = 1;
        const timers = {};  // id -> timer state

        // SVG geometry
        const CX = 110, CY = 110, R = 100;
        const CIRC = 2 * Math.PI * R;

        function createTimerState(id) {
            return {
                id,
                running: false,
                paused: false,
                startTime: null,
                elapsed: 0,
                rafId: null,
                currentTier: 0,
                sessionStart: null,
            };
        }

        function buildSvg(id) {
            const t = timers[id];
            const tier = TIERS[t.currentTier];
            const svg = document.getElementById(`svg-${id}`);
            let html = `<circle class="ring-bg" cx="${CX}" cy="${CY}" r="${R}"/>`;

            const totalSec = tier.maxSeconds;
            let tickInterval, majorEvery;
            if (totalSec <= 60) { tickInterval = 1; majorEvery = 5; }
            else if (totalSec <= 3600) { tickInterval = 60; majorEvery = 5; }
            else if (totalSec <= 14400) { tickInterval = 300; majorEvery = 4; }
            else if (totalSec <= 28800) { tickInterval = 600; majorEvery = 3; }
            else { tickInterval = 900; majorEvery = 4; }

            const numTicks = Math.floor(totalSec / tickInterval);
            for (let i = 0; i < numTicks; i++) {
                const angle = (i / numTicks) * 360 - 90;
                const rad = angle * Math.PI / 180;
                const isMajor = (i % majorEvery === 0);
                const innerR = isMajor ? R - 10 : R - 6;
                const x1 = CX + innerR * Math.cos(rad);
                const y1 = CY + innerR * Math.sin(rad);
                const x2 = CX + R * Math.cos(rad);
                const y2 = CY + R * Math.sin(rad);
                html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${isMajor ? 'tick-major' : 'tick'}"/>`;
            }

            html += `<circle class="ring-progress" id="ring-${id}" cx="${CX}" cy="${CY}" r="${R}"
                    stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/>`;
            svg.innerHTML = html;
        }

        // ─── Render a timer card ───────────────────
        function addTimer() {
            const id = nextId++;
            timers[id] = createTimerState(id);
            const grid = document.getElementById('timersGrid');

            const card = document.createElement('div');
            card.className = 'timer-card';
            card.id = `card-${id}`;
            card.innerHTML = `
            <button class="remove-btn" onclick="removeTimer(${id})" title="Remove">✕</button>
            <input type="text" class="title-input" id="title-${id}" placeholder="Session title…" maxlength="100">
            <div class="tier-label" id="tier-${id}">${TIERS[0].label}</div>
            <div class="timer-container">
                <svg class="timer-svg" id="svg-${id}" viewBox="0 0 220 220"></svg>
                <div class="center">
                    <div class="elapsed" id="elapsed-${id}">00:00:00</div>
                </div>
            </div>
            <div class="controls" id="ctrls-${id}">
                <button class="btn-ctrl btn-start-wide" onclick="startT(${id})">Start</button>
            </div>
        `;
            grid.appendChild(card);
            buildSvg(id);
        }

        function removeTimer(id) {
            const t = timers[id];
            if (t && t.running) stopT(id);
            const card = document.getElementById(`card-${id}`);
            if (card) card.remove();
            delete timers[id];
        }

        // ─── Timer controls ────────────────────────
        function startT(id) {
            const t = timers[id];
            t.running = true; t.paused = false; t.elapsed = 0;
            t.currentTier = 0; t.startTime = new Date(); t.sessionStart = new Date();
            buildSvg(id);
            document.getElementById(`tier-${id}`).textContent = TIERS[0].label;
            document.getElementById(`card-${id}`).classList.add('running');
            renderRunning(id);
            tickT(id);
        }

        function pauseT(id) {
            const t = timers[id];
            if (!t.running) return;
            if (t.paused) {
                t.paused = false; t.startTime = new Date(); tickT(id);
            } else {
                t.paused = true;
                t.elapsed += (Date.now() - t.startTime.getTime()) / 1000;
                cancelAnimationFrame(t.rafId);
            }
            updatePauseIcon(id);
        }

        function stopT(id) {
            const t = timers[id];
            if (!t.running) return;
            t.running = false; t.paused = false;
            cancelAnimationFrame(t.rafId);

            const totalSec = t.elapsed + (Date.now() - t.startTime.getTime()) / 1000;
            const endTime = new Date();
            const title = document.getElementById(`title-${id}`).value.trim() || 'Timer Session';

            // Save session
            sessions.push({
                title,
                start: t.sessionStart.toISOString(),
                end: endTime.toISOString(),
                seconds: totalSec,
            });
            localStorage.setItem('timerSessions', JSON.stringify(sessions));
            updateSessionBadge();

            // Calendar log
            if (calendarEnabled && totalSec > 1) {
                logToCalendar(title, t.sessionStart, endTime, totalSec);
            }

            // Reset UI
            document.getElementById(`card-${id}`).classList.remove('running');
            t.elapsed = 0; t.currentTier = 0;
            buildSvg(id);
            document.getElementById(`elapsed-${id}`).textContent = '00:00:00';
            document.getElementById(`tier-${id}`).textContent = TIERS[0].label;
            renderStart(id);

            showToast(`Session "${title}" saved (${formatDur(totalSec)})`);
        }

        function renderStart(id) {
            document.getElementById(`ctrls-${id}`).innerHTML =
                `<button class="btn-ctrl btn-start-wide" onclick="startT(${id})">Start</button>`;
        }

        function renderRunning(id) {
            document.getElementById(`ctrls-${id}`).innerHTML = `
            <button class="btn-ctrl" id="pauseBtn-${id}" onclick="pauseT(${id})" title="Pause">
                <svg viewBox="0 0 24 24" id="pauseIcon-${id}">
                    <line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/>
                </svg>
            </button>
            <button class="btn-ctrl btn-stop" onclick="stopT(${id})" title="Stop">
                <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
            </button>
        `;
        }

        function updatePauseIcon(id) {
            const icon = document.getElementById(`pauseIcon-${id}`);
            if (!icon) return;
            const t = timers[id];
            icon.innerHTML = t.paused
                ? '<polygon points="7,5 19,12 7,19"/>'
                : '<line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/>';
        }

        function tickT(id) {
            const t = timers[id];
            if (!t.running || t.paused) return;
            const totalSec = t.elapsed + (Date.now() - t.startTime.getTime()) / 1000;

            // tier upgrade
            let newTier = 0;
            for (let i = TIERS.length - 1; i >= 0; i--) {
                if (totalSec >= TIERS[i].maxSeconds && i < TIERS.length - 1) { newTier = i + 1; break; }
                else if (totalSec < TIERS[i].maxSeconds) { newTier = i; }
            }
            if (newTier > t.currentTier) {
                t.currentTier = newTier;
                buildSvg(id);
                document.getElementById(`tier-${id}`).textContent = TIERS[t.currentTier].label;
            }

            const tier = TIERS[t.currentTier];
            const fraction = Math.min(totalSec / tier.maxSeconds, 1);
            const offset = CIRC * (1 - fraction);
            const ring = document.getElementById(`ring-${id}`);
            if (ring) ring.setAttribute('stroke-dashoffset', offset);

            document.getElementById(`elapsed-${id}`).textContent = formatTime(totalSec);
            t.rafId = requestAnimationFrame(() => tickT(id));
        }

        // ─── Helpers ───────────────────────────────
        function formatTime(s) {
            return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(Math.floor(s % 60))}`;
        }
        function pad(n) { return String(n).padStart(2, '0'); }
        function formatDur(s) {
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
            if (h > 0) return `${h}h ${m}m ${sec}s`;
            if (m > 0) return `${m}m ${sec}s`;
            return `${sec}s`;
        }

        function updateSessionBadge() {
            document.getElementById('sessionCount').textContent = sessions.length;
        }

        // ─── Calendar ──────────────────────────────
        async function logToCalendar(title, startDt, endDt, totalSec) {
            try {
                const res = await fetch('/timer/log', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, start_time: startDt.toISOString(), end_time: endDt.toISOString() })
                });
                const data = await res.json();
                if (data.success) showToast('Logged to Calendar ✓');
            } catch (e) { /* silent */ }
        }

        // ─── Download ALL sessions as single .ics ──
        function downloadAllICS() {
            if (sessions.length === 0) { showToast('No sessions to download'); return; }

            const dtFmt = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
            let events = '';

            sessions.forEach(s => {
                events += [
                    'BEGIN:VEVENT',
                    `DTSTART:${dtFmt(s.start)}`,
                    `DTEND:${dtFmt(s.end)}`,
                    `SUMMARY:${s.title}`,
                    `DESCRIPTION:Timer session via OutOfTime\\nDuration: ${formatDur(s.seconds)}`,
                    `UID:${crypto.randomUUID()}@outoftime`,
                    `DTSTAMP:${dtFmt(new Date().toISOString())}`,
                    'STATUS:CONFIRMED',
                    'END:VEVENT',
                    ''
                ].join('\r\n');
            });

            const ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//OutOfTime//Timer//EN',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                events.trimEnd(),
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const dateStr = new Date().toISOString().slice(0, 10);
            a.download = `OutOfTime_Sessions_${dateStr}.ics`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast(`Downloaded ${sessions.length} session(s)`);
        }

        function clearSessions() {
            if (sessions.length === 0) return;
            if (!confirm(`Clear ${sessions.length} stored session(s)?`)) return;
            sessions = [];
            localStorage.removeItem('timerSessions');
            updateSessionBadge();
            showToast('Sessions cleared');
        }

        // ─── Toast ─────────────────────────────────
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ─── Init with one timer ───────────────────
        addTimer();
    </script>
</body>
